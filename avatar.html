<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avatar</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
@supports (height:100dvh){html,body{height:100dvh}}
a:focus-visible,button:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.wrap{max-width:460px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
h1{font-size:28px}
.back{color:var(--text);text-decoration:none;font-size:15px;border:1px solid var(--line);border-radius:14px;padding:9px 14px}
.back:hover{border-color:#3a3a45}
.stage{background:#a7a7ab;border:3px solid #54545c;border-radius:28px;overflow:hidden;padding-bottom:40px}
.stage svg{width:100%;height:auto;display:block}
.panel{position:relative;margin-top:-72px;background:#3f3f46;border:3px solid #1f1f25;border-radius:26px;padding:18px;box-shadow:0 10px 0 #26262c}
.panel h2{font-size:22px;margin-bottom:14px}
.lab{font-size:14px;color:#b9b9c2;margin-bottom:10px}
.line{height:6px;border-radius:6px;background:#fff;margin:18px 0}
/* peles: grade de 3 colunas (cor cor cor / cor cor cor / ...) */
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:min(100%,320px);margin:0 auto}
.sk{display:block;width:100%;height:auto;aspect-ratio:1/1;min-width:0;border-radius:50%;border:3px solid #1a1a20;cursor:pointer;padding:0}
@supports not (aspect-ratio:1/1){.sk{height:0;padding-bottom:100%}}
.sk:hover{transform:scale(1.04)}
.co{display:grid;place-items:center;width:100%;aspect-ratio:1/1;min-width:0;background:#a7a7ab;border:3px solid #1a1a20;border-radius:18px;padding:8px;cursor:pointer;font:inherit;font-size:30px;color:#54545c}
@supports not (aspect-ratio:1/1){.co{height:0;padding-bottom:100%}}
.co img{width:100%;height:100%;object-fit:contain;display:block}
.co{position:relative;overflow:hidden}
.co.lock img{opacity:.4}
.co.lock::after{content:"🔒";position:absolute;inset:0;display:grid;place-items:center;font-size:26px}
.co:hover{border-color:#55555e}
.hint{margin-top:12px;text-align:center;color:#b9b9c2;font-size:13px;line-height:1.4}
.co[aria-pressed="true"]{border-color:var(--o1);box-shadow:0 0 0 3px #3f3f46,0 0 0 6px var(--o1)}
.skw{display:grid;gap:8px;justify-items:center;min-width:0}
.skc{font-size:15px;color:#fff;text-align:center;overflow-wrap:anywhere}
.sk.lock{opacity:.55;font-size:26px;display:grid;place-items:center;color:#fff}
.sk.sp{border-color:#8a5cff;background-image:radial-gradient(circle at 30% 25%,rgba(255,255,255,.22),transparent 45%);box-shadow:0 0 14px rgba(138,92,255,.55)}
.sk.sp[aria-pressed="true"]{box-shadow:0 0 0 3px #3f3f46,0 0 0 6px var(--o1),0 0 16px rgba(138,92,255,.6)}
.sk[aria-pressed="true"]{box-shadow:0 0 0 3px #3f3f46,0 0 0 6px var(--o1)}
.cats{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;row-gap:4px;gap:2px}
.cat{font:inherit;font-size:clamp(15px,4.4vw,18px);color:#fff;background:transparent;border:0;border-radius:10px;padding:6px 4px;cursor:pointer;opacity:.55;white-space:nowrap}
.cat:hover{opacity:.85}
.cat[aria-selected="true"]{opacity:1;color:var(--o2)}
.sep{color:#fff;opacity:.55;font-size:clamp(15px,4.4vw,18px)}
.panel .line{margin:12px 0 18px}
.subs{display:flex;gap:8px;margin-bottom:16px}
.subt{flex:1;font:inherit;font-size:16px;color:#b9b9c2;background:#2c2c33;border:2px solid #1a1a20;border-radius:14px;padding:9px 6px;cursor:pointer}
.subt:hover{border-color:#55555e}
.subt[aria-selected="true"],.subt[aria-pressed="true"]{color:var(--o2);border-color:var(--o1);background:#3a2210}
.over{margin-top:18px}
.over .subs{margin-bottom:0}
.soon{border:2px dashed #55555e;border-radius:18px;padding:16px;text-align:center;color:#b9b9c2;font-size:15px;line-height:1.4}
.saved{margin-top:14px;text-align:center;color:#b9b9c2;font-size:14px;min-height:18px}
.bodies{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bopt{font:inherit;font-size:15px;color:var(--text);background:#2c2c33;border:3px solid #1a1a20;border-radius:18px;padding:10px 6px 12px;cursor:pointer;display:grid;justify-items:center;gap:8px}
.bopt:hover{border-color:#55555e}
.bopt[aria-pressed="true"]{border-color:var(--o1);background:#3a2210}
.bopt img{height:96px;width:auto;display:block;background:#a7a7ab;border-radius:12px;padding:6px 14px}
@media(min-width:900px){
  .bopt img{height:140px}
  .cat,.sep{font-size:14px}
  main{padding:28px 32px 28px}
  .wrap{max-width:1120px}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:stretch}
  .stage{padding-bottom:0;height:calc(100vh - 150px);min-height:460px;display:grid}
  .stage svg{height:100%}
  .panel{margin-top:0;padding:26px;display:flex;flex-direction:column}
  .soon{flex:1;display:grid;place-items:center;font-size:17px}
  .saved{margin-top:12px}
  .panel h2{font-size:26px;margin-bottom:20px}
}
@media(max-width:640px){
  .cat{font-size:clamp(10px,2.75vw,18px);padding:6px 0}
  .sep{font-size:clamp(10px,2.75vw,18px)}
}
</style>
</head>
<body>
<nav aria-label="Navegação principal">
  <a href="index.html" aria-label="Trilha"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/></svg></a>
  <a href="comunidade.html" aria-label="Comunidade"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><circle cx="5.5" cy="10" r="2"/><circle cx="18.5" cy="10" r="2"/><path d="M6.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5z"/></svg></a>
  <a href="loja.html" aria-label="Loja"><svg viewBox="0 0 24 24"><path d="M4 20v-6a8 8 0 0116 0v6z"/><path d="M9 8V5h6v3"/></svg></a>
  <a href="avisos.html" aria-label="Avisos"><svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0112 0v6l1.5 2h-15z"/><path d="M10 21h4"/></svg></a>
  <a href="perfil.html" class="on" aria-current="page" aria-label="Perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/></svg></a>
</nav>

<main>
  <div class="wrap">
    <div class="top"><h1>Meu avatar</h1><a class="back" href="perfil.html">← Perfil</a></div>
    <div class="grid">
      <div class="stage" id="stage"></div>
      <section class="panel" aria-label="Personalizar avatar">
        <div class="cats" id="cats" role="tablist" aria-label="Categorias do avatar"></div>
        <div class="line" aria-hidden="true"></div>
        <div class="opts" id="opts" role="tabpanel"></div>
        <div class="saved" id="saved" role="status"></div>
      </section>
    </div>
  </div>
</main>

<script src="avatar.js"></script>
<script src="loja.js"></script>
<script>if(!window.Avatar||!window.Loja)document.write('<p style="padding:24px;color:#ff6b73;font-family:sans-serif">Faltam arquivos: coloque avatar.js e loja.js na mesma pasta de avatar.html.</p>')</script>
<script>
const $=id=>document.getElementById(id);
const {SKIN,SKIN_N,BODIES,tinted,svg:avatarSVG,KEY}=Avatar;
let A=Avatar.saved()||{body:'corpo1',skin:1};
// de onde o jogador veio (perfil ou comunidade), para o botão Voltar
const from=new URLSearchParams(location.search).get('de');
if(from==='comunidade'){const b=document.querySelector('.back');b.href='comunidade.html#avatar';b.textContent='← Comunidade'}
function save(){
  try{const o={body:A.body,skin:A.skin,over:A.over==='pants'?'pants':'shirt'};Avatar.SLOTS.forEach(([,k])=>{o[k]=A[k]||null});localStorage.setItem(KEY,JSON.stringify(o));$('saved').textContent='✓ Salvo automaticamente'}
  catch(e){$('saved').textContent='Não foi possível salvar neste navegador.'}
}
// abas de peça: aba -> [tipo da peça em CLOTHES, campo salvo no avatar, rótulo de "sem peça"]
const CLOTH_TABS={cabelo:['hair','hair','sem cabelo'],camisa:['shirt','shirt','sem camisa'],camiseta:['tshirt','tshirt','sem camiseta'],calca:['pants','pants','sem calça'],cintura:['belt','belt','sem cintura'],bota:['boots','boots','sem botas'],bracelete:['bracelets','bracelets','sem braceletes'],capa:['cape','cape','sem capa']};
// sub-abas: aba -> [[id, nome]]. Cada sub-aba de peça: id -> [tipo da peça, campo salvo, rótulo de "sem peça", texto de "em breve"]
const SUBS={pele:[['cor','cor'],['tatuagens','tatuagens']],rosto:[['maquiagem','maquiagem'],['olhos','olhos'],['boca','boca']]};
const SUB_PIECE={tatuagens:['tattoo','tattoo','sem tatuagem','Tatuagens em breve'],maquiagem:['makeup','makeup','sem maquiagem','Maquiagem em breve'],olhos:['eyes','eyes','sem olhos','Olhos em breve'],boca:['mouth','mouth','sem boca','Bocas em breve']};
const CATS=[['corpo','corpo'],['pele','pele'],['cabelo','cabelo'],['camisa','camisa'],['camiseta','camiseta'],['calca','calça'],['cintura','cintura'],['bota','bota'],['bracelete','bracelete'],['capa','capa'],['rosto','rosto']];
let cat='corpo';const sub={pele:'cor',rosto:'olhos'};
// abre direto numa aba/sub-aba (ex.: avatar.html?aba=rosto&sub=boca, usado pela Loja)
{const qs=new URLSearchParams(location.search),q=qs.get('aba'),s=qs.get('sub');if(CATS.some(c=>c[0]===q))cat=q;if(SUBS[cat]&&SUBS[cat].some(x=>x[0]===s))sub[cat]=s}
function drawCats(){
  const c=$('cats');c.innerHTML='';
  CATS.forEach(([id,nome],n)=>{
    if(n){const p=document.createElement('span');p.className='sep';p.setAttribute('aria-hidden','true');p.textContent='|';c.appendChild(p)}
    const t=document.createElement('button');t.type='button';t.className='cat';t.id='cat-'+id;t.setAttribute('role','tab');
    t.setAttribute('aria-selected',cat===id?'true':'false');t.textContent=nome;
    t.onclick=()=>{cat=id;drawCats();drawOpts()};c.appendChild(t);
  });
  $('opts').setAttribute('aria-labelledby','cat-'+cat);
}
// aviso de peça bloqueada, com link para a categoria certa da Loja
function shopMsg(prefix,shopCat){const m=$('saved');m.textContent=prefix;const a=document.createElement('a');a.href='loja.html#'+shopCat;a.textContent='compre na Loja';a.style.color='var(--o2)';m.appendChild(a)}
// peças pequenas (botas, olhos, boca, maquiagem, tatuagem) aparecem como recorte no avatar; a imagem sozinha ficaria minúscula
const CROP_SLOTS=['cape','bracelets','boots','eyes','mouth','makeup','tattoo'];
function drawSubs(o){
  const st=document.createElement('div');st.className='subs';st.setAttribute('role','tablist');st.setAttribute('aria-label',cat==='pele'?'Pele':'Rosto');
  SUBS[cat].forEach(([id,nome])=>{
    const t=document.createElement('button');t.type='button';t.className='subt';t.setAttribute('role','tab');
    t.setAttribute('aria-selected',sub[cat]===id?'true':'false');t.textContent=nome;
    t.onclick=()=>{sub[cat]=id;drawOpts()};st.appendChild(t);
  });o.appendChild(st);
}
// grade de peças de um tipo: "sem peça" + uma opção por peça que existe para o corpo escolhido. Peça não comprada fica bloqueada.
function pieceGrid(o,[slot,key,none,soon]){
  const body=BODIES.find(b=>b.id===A.body);
  const all=Object.entries(Avatar.CLOTHES).filter(([,c])=>c.slot===slot);
  if(!all.length){const d=document.createElement('div');d.className='soon';d.textContent=soon||'Em breve';o.appendChild(d);return}
  const fit=all.filter(([,c])=>c.por_corpo[body.id]);
  const g=document.createElement('div');g.className='skins';
  const opts=[[null,none]].concat(fit.map(([id,c])=>[id,c.n.toLowerCase()]));
  opts.forEach(([id,nome])=>{
    const lock=!!id&&!Avatar.ownsPiece(id);
    const x=document.createElement('button');x.type='button';x.className='co'+(lock?' lock':'');x.setAttribute('aria-pressed',(A[key]||null)===id?'true':'false');
    x.setAttribute('aria-label',nome+(lock?' (bloqueado: compre na loja)':''));
    if(id){const im=document.createElement('img');im.alt='';im.src=CROP_SLOTS.includes(slot)?Avatar.previewURL(A,id):Avatar.CLOTHES[id].por_corpo[body.id].src;x.appendChild(im)}else x.textContent='✕';
    x.onclick=()=>{
      if(lock){const it=Avatar.shopItem(id);shopMsg('Peça bloqueada: ',it?it.cat:'especiais');return}
      A[key]=id;save();render()};
    const w=document.createElement('div');w.className='skw';const cap=document.createElement('span');cap.className='skc';cap.textContent=nome;cap.setAttribute('aria-hidden','true');
    w.append(x,cap);g.appendChild(w);
  });o.appendChild(g);
  if(fit.length<all.length){const t=document.createElement('p');t.className='hint';t.textContent='Alguns itens ainda não têm versão para este corpo.';o.appendChild(t)}
}
// quem fica por cima: camisa ou calça (aparece nas abas camisa e calça)
function drawOver(o){
  const w=document.createElement('div');w.className='over';
  const l=document.createElement('div');l.className='lab';l.textContent='Quem fica por cima?';w.appendChild(l);
  const st=document.createElement('div');st.className='subs';st.setAttribute('role','group');st.setAttribute('aria-label','Quem fica por cima');
  [['shirt','camisa'],['pants','calça']].forEach(([id,nome])=>{
    const t=document.createElement('button');t.type='button';t.className='subt';t.setAttribute('aria-pressed',(A.over==='pants'?'pants':'shirt')===id?'true':'false');
    t.textContent=nome+' por cima';t.onclick=()=>{A.over=id;save();render()};st.appendChild(t);
  });w.appendChild(st);o.appendChild(w);
}
function drawOpts(){
  const o=$('opts');o.innerHTML='';
  if(cat==='corpo'){
    const bx=document.createElement('div');bx.className='bodies';
    BODIES.forEach(b=>{
      const x=document.createElement('button');x.type='button';x.className='bopt';x.setAttribute('aria-pressed',A.body===b.id?'true':'false');
      x.innerHTML='<img alt="" src="'+tinted(b,A.skin)+'"><span></span>';x.lastChild.textContent=b.n;
      x.onclick=()=>{A.body=b.id;save();render()};bx.appendChild(x);
    });o.appendChild(bx);
  }else if(cat==='pele'){
    drawSubs(o);
    if(sub.pele==='tatuagens'){pieceGrid(o,SUB_PIECE.tatuagens);return}
    const s=document.createElement('div');s.className='skins';
    SKIN.forEach((c,i)=>{
      const sp=(Avatar.SKIN_SPECIAL||[]).includes(i),lock=Avatar.owns?!Avatar.owns(i):false;
      const x=document.createElement('button');x.type='button';x.className='sk'+(sp?' sp':'')+(lock?' lock':'');x.style.backgroundColor=c;
      x.setAttribute('aria-label',SKIN_N[i]+(i<3?' '+(i+1):'')+(sp?' (cor especial'+(lock?', bloqueada: compre na loja':'')+')':''));
      x.setAttribute('aria-pressed',A.skin===i?'true':'false');
      if(lock)x.textContent='🔒';
      x.onclick=()=>{
        if(lock){shopMsg('Cor especial: ','especiais');return}
        A.skin=i;save();render()};
      const w=document.createElement('div');w.className='skw';const cap=document.createElement('span');cap.className='skc';cap.textContent=SKIN_N[i];cap.setAttribute('aria-hidden','true');
      w.append(x,cap);s.appendChild(w);
    });o.appendChild(s);
  }else if(cat==='rosto'){
    drawSubs(o);pieceGrid(o,SUB_PIECE[sub.rosto]);
  }else if(CLOTH_TABS[cat]){
    pieceGrid(o,CLOTH_TABS[cat]);
    if(cat==='camisa'||cat==='calca')drawOver(o);
  }else{
    const d=document.createElement('div');d.className='soon';d.textContent='Em breve';o.appendChild(d);
  }
}
function render(){$('stage').innerHTML=avatarSVG(A);drawCats();drawOpts()}
Avatar.ready(render);
</script>
</body>
</html>
