<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loja</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
@supports (height:100dvh){html,body{height:100dvh}}
nav a:focus-visible,.ttl:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.wrap{max-width:760px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
h1{font-size:26px;font-weight:700}
.gold{display:flex;align-items:center;gap:8px;background:#1c1606;border:1px solid #5c4208;border-radius:14px;padding:8px 14px;color:#ffd24a;font-size:20px}
.gold svg{width:22px;height:22px;fill:#f5b400;stroke:#b57a00;stroke-width:1.5}
.gold svg .in{fill:none;stroke:#fff3b0;stroke-width:1.5}
.secs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#0f0f14;border:1px solid var(--line);border-radius:16px;padding:5px;margin-bottom:14px}
.sec{font:inherit;font-size:16px;color:var(--mute);background:transparent;border:0;border-radius:12px;padding:11px 6px;cursor:pointer}
.sec:hover{color:var(--text)}
.sec[aria-selected="true"]{background:#2a1405;color:var(--o2);box-shadow:inset 0 0 0 1px #6b3410}
.pv.tt{background:#1c1606;font-size:44px}
.pv.gd{background:#1c1606;display:grid;gap:2px;align-content:center;justify-items:center}
.pv.gd svg{width:44%;height:auto;fill:#f5b400;stroke:#b57a00;stroke-width:1.5}
.pv.gd .in{fill:none;stroke:#fff3b0}
.item.off{cursor:not-allowed;opacity:.6}
.item.off .pr{color:var(--mute);background:#14141a;border-color:#24242c}
.tabs[hidden]{display:none!important}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.tab{font:inherit;font-size:16px;color:var(--mute);background:#0f0f14;border:1px solid var(--line);border-radius:14px;padding:10px 16px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{background:#2a1405;color:var(--o2);border-color:#6b3410}
.codes[hidden]{display:none!important}
.codes{background:#121217;border:1px solid #24242c;border-radius:20px;padding:16px;max-width:460px}
.codes label{display:block;font-size:16px;margin-bottom:8px}
.crow{display:flex;gap:10px}
.crow input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--text);background:#0f0f14;border:2px solid #24242c;border-radius:14px;padding:12px 14px;text-transform:uppercase;letter-spacing:.06em}
.crow input:focus-visible{outline:2px solid var(--text);outline-offset:2px;border-color:#6b3410}
.crow .btn{white-space:nowrap}
.cmsg{min-height:20px;margin-top:12px;font-size:15px;line-height:1.4}
.cmsg.ok{color:#4ade80}
.cmsg.err{color:#ff6b73}
.sub{color:#b4b1ae;font-size:15px;line-height:1.4;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.item{font:inherit;color:var(--text);text-align:center;background:#121217;border:2px solid #24242c;border-radius:20px;padding:10px 10px 12px;display:grid;gap:8px;justify-items:center;cursor:pointer;box-shadow:0 4px 0 #0c0c10}
.item:hover{border-color:#3a3a45}
.pv{width:100%;aspect-ratio:1;border-radius:14px;background:#a7a7ab;display:grid;place-items:center;overflow:hidden}
.pv img{width:84%;height:84%;border-radius:50%;display:block}
.pv.sq img{width:92%;height:92%;border-radius:12px}
.nm{font-size:16px;line-height:1.15;overflow-wrap:anywhere}
.tp{font-size:13px;color:var(--mute);line-height:1;margin-top:-4px}
.pr{white-space:nowrap;font-size:15px;color:#ffd24a;background:#1c1606;border:1px solid #5c4208;border-radius:10px;padding:3px 10px;display:inline-flex;align-items:center;gap:6px}
.pr svg{width:15px;height:15px;fill:#f5b400;stroke:#b57a00;stroke-width:1.5}
.item.own{border-color:#1f6b3a}
.item.own .pr{color:#4ade80;background:#0d2a17;border-color:#1f6b3a}
.item.poor .pr{color:#ff6b73;background:#2a0d10;border-color:#6b1f26}
.ph{aspect-ratio:.85;border:2px dashed #2a2a33;border-radius:20px;background:#0f0f14;display:grid;place-items:center;color:#3a3a45;font-size:30px}
.empty{margin-top:16px;text-align:center;color:var(--mute);font-size:15px;line-height:1.4}
.empty b{display:block;color:var(--o2);font-size:20px;margin-bottom:2px}
a:focus-visible,button:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.btn{text-decoration:none;text-align:center;display:block}
dialog{margin:auto;width:calc(100% - 32px);max-width:380px;background:#121217;color:var(--text);border:1px solid #2a2a33;border-radius:22px;padding:22px;font-family:inherit}
dialog h2{font-size:22px;margin-bottom:10px}
dialog p{color:#b4b1ae;font-size:16px;line-height:1.4;margin-bottom:16px}
.dbtns{display:flex;gap:10px}
.dbtns>*{flex:1}
@media(max-width:640px){
  .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .item{min-width:0;padding:8px 6px 10px}
  .pv.gd b{font-size:20px!important}
  .nm{font-size:14px}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
  .tab{padding:6px 2px;font-size:13px;border-radius:10px;text-align:center}
}
</style>
</head>
<body>
<nav aria-label="Navegação principal">
  <a href="index.html" aria-label="Trilha"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/></svg></a>
  <a href="comunidade.html" aria-label="Comunidade"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><circle cx="5.5" cy="10" r="2"/><circle cx="18.5" cy="10" r="2"/><path d="M6.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5z"/></svg></a>
  <a href="loja.html" class="on" aria-current="page" aria-label="Loja"><svg viewBox="0 0 24 24"><path d="M4 20v-6a8 8 0 0116 0v6z"/><path d="M9 8V5h6v3"/></svg></a>
  <a href="avisos.html" aria-label="Avisos"><svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0112 0v6l1.5 2h-15z"/><path d="M10 21h4"/></svg></a>
  <a href="perfil.html" aria-label="Perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/></svg></a>
</nav>

<main>
  <div class="wrap">
    <div class="top"><h1>Loja</h1><div class="gold" title="Seu ouro"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.5" class="in"/></svg><b id="gN">0</b><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden">ouro</span></div></div>
    <div class="secs" id="secs" role="tablist" aria-label="Seções da loja"></div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Categorias da loja"></div>
    <p class="sub" id="sub"></p>
    <div class="grid" id="grid" role="tabpanel"></div>
    <div class="codes" id="codes" hidden>
      <label for="cIn">Digite seu código</label>
      <div class="crow"><input id="cIn" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="32" placeholder="CÓDIGO"><button class="btn" type="button" id="cGo">Resgatar</button></div>
      <div class="cmsg" id="cMsg" role="status"></div>
    </div>
    <div class="empty" id="empty" hidden><b>Em breve</b>Novos itens chegam em breve. Vá juntando ouro nas missões!</div>
  </div>
  <div class="toast" id="toast" role="status"></div>
</main>

<dialog id="dBuy" aria-labelledby="bTitle">
  <h2 id="bTitle"></h2>
  <p id="bTxt"></p>
  <div class="dbtns"><button class="btn alt" type="button" id="bNo">Cancelar</button><button class="btn" type="button" id="bYes">Comprar</button></div>
</dialog>
<dialog id="dOk" aria-labelledby="oTitle">
  <h2 id="oTitle">Comprado! 🎉</h2>
  <p id="oTxt"></p>
  <div class="dbtns"><button class="btn alt" type="button" id="oClose">Fechar</button><button class="btn" type="button" id="oGo">Usar no avatar</button></div>
</dialog>

<script src="avatar.js"></script>
<script src="loja.js"></script>
<script>if(!window.Avatar||!window.Loja)document.write('<p style="padding:24px;color:#ff6b73;font-family:sans-serif">Faltam arquivos: coloque avatar.js e loja.js na mesma pasta de loja.html.</p>')</script>
<script>
const $=id=>document.getElementById(id);
const fmt=n=>Number(n).toLocaleString('pt-BR');
const COIN='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/></svg>';
const SUB={especiais:'Itens raros para o seu avatar.',rostos:'Olhos, bocas e maquiagem para o seu avatar.',cabelos:'Cabelos para o seu avatar.',calcas:'Calças e peças de cintura (cintos e saias, que se usam junto com as calças).',botas:'Botas para o seu avatar.',braceletes:'Braceletes para o seu avatar.',capas:'Capas para vestir por cima de tudo.',camisas:'Camisas e camisetas (as camisetas se vestem por cima das camisas).',sazonais:'Itens por tempo limitado.'};
const SECS=[['titulos','Títulos'],['avatar','Avatar'],['recursos','Recursos']];
const RSUBS=[['ouro','Ouro'],['codigos','Códigos']];
let sec='avatar',cat='especiais',rsub='ouro';
{const hs=(location.hash||'').slice(1);
 if(hs==='titulos'||hs==='recursos')sec=hs;else if(hs==='codigos'){sec='recursos';rsub='codigos'}else if(Loja.CATS.some(c=>c[0]===hs)){sec='avatar';cat=hs}}
let tt;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2400)}
function gold(){$('gN').textContent=fmt(Loja.gold())}
function go(id){history.replaceState(null,'','#'+id)}
function secs(){
  const t=$('secs');t.innerHTML='';
  SECS.forEach(([id,nome])=>{
    const b=document.createElement('button');b.type='button';b.className='sec';b.id='s-'+id;b.setAttribute('role','tab');
    b.setAttribute('aria-selected',id===sec?'true':'false');b.textContent=nome;
    b.onclick=()=>{sec=id;go(id==='avatar'?cat:id==='recursos'&&rsub==='codigos'?'codigos':id);render()};t.appendChild(b);
  });
}
function tabs(){
  const t=$('tabs');t.innerHTML='';t.hidden=sec==='titulos';
  const list=sec==='recursos'?RSUBS:Loja.CATS,cur=sec==='recursos'?rsub:cat;
  list.forEach(([id,nome])=>{
    const b=document.createElement('button');b.type='button';b.className='tab';b.id='t-'+id;b.setAttribute('role','tab');
    b.setAttribute('aria-selected',id===cur?'true':'false');b.textContent=nome;
    b.onclick=()=>{if(sec==='recursos'){rsub=id;go(id==='ouro'?'recursos':id)}else{cat=id;go(id)}tabs();grid()};t.appendChild(b);
  });
}
function render(){secs();tabs();$('grid').setAttribute('aria-labelledby','s-'+sec);grid()}
// pré-visualização: rosto do avatar do jogador com a cor do item
function preview(it){
  const a=Avatar.saved()||{body:'corpo1',skin:1},key=it.piece||it.hair;
  return key?Avatar.previewURL(a,key):Avatar.faceURL({body:a.body,skin:it.skin});
}
// peças que não são do rosto (camisa, calça, botas, tatuagem) aparecem num quadrado, não num círculo
const quadrado=it=>{const c=Avatar.CLOTHES[it.piece||it.hair];return !!c&&!Avatar.FACE_SLOTS.includes(c.slot)};
// onde o item é escolhido no avatar (aba) e como aparece nas mensagens
// kind -> [aba do avatar, nome mostrado nas mensagens, sub-aba (opcional)]
const ONDE={pele:['pele','pele'],cabelo:['cabelo','cabelo'],camisa:['camisa','camisa'],camiseta:['camiseta','camiseta'],cintura:['cintura','cintura'],bracelete:['bracelete','bracelete'],capa:['capa','capa'],calca:['calca','calça'],bota:['bota','bota'],
  olhos:['rosto','rosto › olhos','olhos'],boca:['rosto','rosto › boca','boca'],maquiagem:['rosto','rosto › maquiagem','maquiagem'],tatuagem:['pele','pele › tatuagens','tatuagens']};
// etiqueta mostrada embaixo do nome nas categorias que juntam dois tipos de peça
const TIPO={camisa:'Camisa',camiseta:'Camiseta',calca:'Calça',cintura:'Cintura'};
const onde=it=>ONDE[it.kind]||ONDE.pele;
function card(pv,name,priceEl,cls,fn,label){
  const b=document.createElement('button');b.type='button';b.className='item '+(cls||'');b.setAttribute('aria-label',label||name);
  const nm=document.createElement('div');nm.className='nm';nm.textContent=name;
  b.append(pv,nm,priceEl);b.onclick=fn;return b;
}
function priceEl(it,own){
  const pr=document.createElement('div');pr.className='pr';
  if(own)pr.textContent=it.price===0?'✓ Grátis':'✓ Comprado';else{pr.innerHTML=COIN;pr.append(' '+fmt(it.price))}
  return pr;
}
function grid(){
  const g=$('grid');g.innerHTML='';$('empty').hidden=true;g.hidden=sec==='recursos'&&rsub==='codigos';$('codes').hidden=!g.hidden;
  if(sec==='avatar'){
    $('sub').textContent=SUB[cat]||'';
    const items=Loja.CATALOG.filter(i=>i.cat===cat).sort((x,y)=>Loja.owned(x.id)-Loja.owned(y.id));
    items.forEach(it=>{
      const own=Loja.owned(it.id),poor=!own&&Loja.gold()<it.price;
      const pv=document.createElement('div');pv.className='pv'+(quadrado(it)?' sq':'');const im=document.createElement('img');im.alt='';im.src=preview(it);pv.appendChild(im);
      const tp=TIPO[it.kind],c=card(pv,it.name,priceEl(it,own),(own?'own':'')+(poor?' poor':''),()=>pick(it),(tp?tp+': ':'')+it.name+(own?(it.price===0?', grátis':', já comprado'):', '+it.price+' de ouro'));
      if(tp){const t=document.createElement('div');t.className='tp';t.textContent=tp;c.insertBefore(t,c.lastChild)}
      g.appendChild(c);
    });
    // categorias ainda sem itens: quadrados vazios, como na maquete
    if(!items.length)for(let i=0;i<6;i++){const p=document.createElement('div');p.className='ph';p.setAttribute('aria-hidden','true');p.textContent='?';g.appendChild(p)}
    $('empty').hidden=items.length>0;
  }else if(sec==='titulos'){
    $('sub').textContent='Títulos aparecem embaixo do seu nível. Troque o que está em uso no Perfil.';
    const ex=Loja.extraTitleId();
    [...Loja.TITLES_SHOP].sort((x,y)=>Loja.titleOwned(x.id)-Loja.titleOwned(y.id)).forEach(t=>{
      const own=Loja.titleOwned(t.id);
      const pv=document.createElement('div');pv.className='pv tt';pv.textContent='🎖️';
      const poor=!own&&Loja.gold()<t.price;
      g.appendChild(card(pv,t.name,priceEl(t,own),(own?'own':'')+(poor?' poor':''),()=>pickTitle(t),t.name+(own?(t.price===0?', grátis':', já comprado'):', '+t.price+' de ouro')+(ex===t.id?', em uso':'')));
    });
  }else if(rsub==='codigos'){
    $('sub').textContent='Digite um código para ganhar um prêmio. Cada código só pode ser usado uma vez.';
  }else{
    $('sub').textContent='Compre ouro para gastar na loja. A compra ainda não está disponível.';
    Loja.PACKS.forEach(n=>{
      const pv=document.createElement('div');pv.className='pv gd';
      pv.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.5" class="in"/></svg>';
      const v=document.createElement('b');v.style.cssText='font-size:26px;color:#ffd24a';v.textContent=fmt(n);pv.appendChild(v);
      const pr=document.createElement('div');pr.className='pr';pr.textContent='Em breve';
      const c=card(pv,'Ouro',pr,'off',()=>toast('A compra de ouro ainda não está disponível.'),fmt(n)+' de ouro, indisponível');
      c.setAttribute('aria-disabled','true');g.appendChild(c);
    });
  }
}
let cur=null,mode='avatar';
function openOk(title,txt,btn){$('oTitle').textContent=title;$('oTxt').textContent=txt;$('oGo').textContent=btn;$('dOk').showModal()}
function pick(it){
  mode='avatar';cur=it;
  if(Loja.owned(it.id)){mode='avatar';openOk(it.price===0?it.name+' é grátis! 🎁':'Você já tem!',it.name+' já está liberado. Escolha em Avatar › '+onde(it)[1]+'.','Usar no avatar');return}
  if(Loja.gold()<it.price){toast('Faltam '+fmt(it.price-Loja.gold())+' de ouro. Complete missões para ganhar mais!');return}
  $('bTitle').textContent='Comprar '+it.name+'?';
  $('bTxt').textContent=it.desc+' por '+fmt(it.price)+' de ouro. Você ficará com '+fmt(Loja.gold()-it.price)+'.';
  $('dBuy').showModal();
}
function pickTitle(t){
  mode='titulo';cur=t;
  if(!Loja.titleOwned(t.id)){
    if(Loja.gold()<t.price){toast('Faltam '+fmt(t.price-Loja.gold())+' de ouro. Complete missões para ganhar mais!');return}
    $('bTitle').textContent='Comprar o título "'+t.name+'"?';
    $('bTxt').textContent=t.desc+' por '+fmt(t.price)+' de ouro. Você ficará com '+fmt(Loja.gold()-t.price)+'.';
    $('dBuy').showModal();return;
  }
  openOk(t.price===0?t.name+' é grátis! 🎁':'Você já tem!','O título "'+t.name+'" está liberado. Quer usar agora?',Loja.extraTitleId()===t.id?'Em uso ✓':'Usar título');
}
function redeem(){
  const m=$('cMsg'),r=Loja.redeem($('cIn').value);
  m.className='cmsg '+(r.ok?'ok':'err');
  m.textContent=r.ok?'🎉 '+r.msg:r.reason==='empty'?'Digite um código.':r.reason==='used'?'Este código já foi usado.':r.reason==='save'?'Não foi possível salvar neste navegador.':'Código inválido.';
  if(r.ok){$('cIn').value='';gold()}
}
$('cGo').onclick=redeem;
$('cIn').addEventListener('keydown',e=>{if(e.key==='Enter')redeem()});
$('bNo').onclick=()=>$('dBuy').close();
$('bYes').onclick=()=>{
  $('dBuy').close();const r=Loja.buy(cur.id);
  if(!r.ok){toast(r.reason==='gold'?'Ouro insuficiente.':r.reason==='save'?'Não foi possível salvar neste navegador.':'Não foi possível comprar.');gold();grid();return}
  gold();grid();
  if(mode==='titulo'){openOk('Comprado! 🎉','O título "'+cur.name+'" agora é seu. Quer usar agora?','Usar título');return}
  openOk('Comprado! 🎉',cur.name+' agora é seu. Escolha em Avatar › '+onde(cur)[1]+'.','Usar no avatar');
};
$('oClose').onclick=()=>$('dOk').close();
$('oGo').onclick=()=>{
  if(mode==='titulo'){Loja.setExtraTitle(cur.id);$('dOk').close();grid();toast('Título em uso: '+cur.name)}
  else location.href='avatar.html?aba='+onde(cur)[0]+(onde(cur)[2]?'&sub='+onde(cur)[2]:'');
};
['dBuy','dOk'].forEach(i=>$(i).addEventListener('click',e=>{if(e.target===$(i))$(i).close()}));
window.addEventListener('pageshow',()=>{gold();grid()});
Avatar.ready(()=>{gold();render()});
</script>
</body>
</html>
